# Serves the Vite build's static output. `try_files ... /index.html` is the
# one thing a plain static file server needs that a dev server (Vite's own,
# or `vite preview`) gives you for free: React Router v7 (Phase 10) does
# client-side routing, so a direct load of e.g. /incidents/INC-123 has to
# fall back to index.html and let the client-side router take over, rather
# than nginx 404ing on a path that has no matching file on disk.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
