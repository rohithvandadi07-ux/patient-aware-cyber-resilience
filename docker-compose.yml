# Phase 1 foundation only: backend API + Postgres/TimescaleDB.
#
# Hyperledger Fabric's test-network is deliberately NOT included here yet — it is
# brought up separately via its own sample scripts in blockchain/network/ once
# Phase 8 starts (architecture spec Section 14). Keeping it out of this file until
# then avoids making every `docker compose up` during Phase 1-7 development pay
# for a blockchain network nothing is using yet.

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: pacr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-patient_aware_cyber_resilience}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pacr_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: pacr-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-patient_aware_cyber_resilience}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  pacr_db_data:
