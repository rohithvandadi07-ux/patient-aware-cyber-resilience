[pytest]
; Phase 11: top-level end-to-end suite (Scenario A/B through the real UI).
; `pythonpath` is relative to this file's directory, so this adds backend/
; to sys.path the same way backend/pytest.ini's `pythonpath = .` does for
; backend's own suite -- this file is what lets `from app.agents...` resolve
; when pytest's rootdir is this `tests/` directory rather than `backend/`.
pythonpath = ../backend
testpaths = e2e
; Playwright's own browser launch/navigation is slower than anything else
; in this codebase's test suites; the default is unbounded, but a generous
; explicit ceiling catches a genuinely hung server/browser instead of
; blocking forever.
timeout = 180
