[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patient-aware-cyber-resilience"
version = "0.1.0"
description = "Patient-aware, controlled-autonomy cyber-resilience platform for safety-critical healthcare IoMT"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.12",
  "structlog>=24.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "joblib>=1.4",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.9",
]

[project.optional-dependencies]
ml = ["xgboost>=2.1", "imbalanced-learn>=0.12"]
fabric = ["fabric-sdk-py>=1.0.0"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
  "pre-commit>=4.0",
  "detect-secrets>=1.5",
]

[project.scripts]
pacr = "backend.app.cli:app"

[tool.setuptools.packages.find]
include = [
  "backend*", "iomt_simulator*", "cybersecurity*", "incident*",
  "risk_engine*", "agents*", "response_engine*", "recovery*",
  "blockchain*", "datasets*", "evaluation*", "experiments*",
]
exclude = ["tests*", "frontend*", "notebooks*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "frontend", "blockchain/fabric/chaincode"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S"]
ignore = ["S101", "B008", "RUF012", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501", "N806", "RUF043"]
# `X` for a design matrix and `y` for labels are universal ML conventions;
# renaming them to satisfy pep8-naming would make the code less readable to
# anyone who knows scikit-learn.
"cybersecurity/detectors/**" = ["N803", "N806"]
"cybersecurity/splits.py" = ["N803", "N806"]
"evaluation/**" = ["N803", "N806", "S311"]
"experiments/**" = ["N803", "N806", "S311"]
"iomt_simulator/**" = ["S311"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = "(notebooks|frontend|build|dist)"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: isolated component tests",
  "integration: multi-component tests",
  "e2e: full closed-loop lifecycle tests",
  "scenario: mandated deterministic research scenarios",
  "slow: long-running tests",
  "fabric: requires a running Hyperledger Fabric network",
  "requires_dataset: requires a licensed benchmark dataset to be present",
]
filterwarnings = ["error::DeprecationWarning:backend.*"]

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/notebooks/*", "*/__init__.py"]
